<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phonics Game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');

  :root {
    --bg: #f0f4ff;
    --card-bg: #ffffff;
    --primary: #5c6ef8;
    --primary-light: #eef0ff;
    --accent: #ff6b6b;
    --accent2: #ffd93d;
    --accent3: #6bcb77;
    --text: #2d3048;
    --text-muted: #8b91b5;
    --shadow: 0 8px 32px rgba(92,110,248,0.13);
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: -20%;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle, rgba(92,110,248,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    right: -10%;
    width: 50%;
    height: 50%;
    background: radial-gradient(circle, rgba(255,107,107,0.10) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 540px;
    padding: 20px;
  }

  .screen { display: none; animation: fadeUp 0.4s ease; }
  .screen.active { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .game-title {
    font-family: 'Baloo 2', cursive;
    font-size: 2.6rem;
    color: var(--primary);
    text-align: center;
    margin-bottom: 3px;
    letter-spacing: -0.5px;
    text-shadow: 0 4px 16px rgba(92,110,248,0.18);
  }
  .game-subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 28px;
  }

  .group-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-bottom: 22px;
  }

  .group-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    border: 3px solid transparent;
    box-shadow: var(--shadow);
    transition: all 0.22s ease;
    user-select: none;
  }
  .group-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(92,110,248,0.18); }
  .group-card.selected { border-color: var(--primary); background: var(--primary-light); }

  .group-card-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Baloo 2', cursive;
    font-size: 1.5rem;
    font-weight: 800;
    flex-shrink: 0;
    color: #fff;
  }
  .icon-1 { background: linear-gradient(135deg, #5c6ef8, #8b9dff); }
  .icon-2 { background: linear-gradient(135deg, #ff6b6b, #ffaa6b); }
  .icon-3 { background: linear-gradient(135deg, #6bcb77, #4db8a5); }
  .icon-4 { background: linear-gradient(135deg, #f7b731, #fd9644); }
  .icon-5 { background: linear-gradient(135deg, #d980fa, #9b59b6); }

  .group-card-info { flex: 1; }
  .group-card-name {
    font-family: 'Baloo 2', cursive;
    font-size: 1.15rem;
    color: var(--text);
    margin-bottom: 3px;
  }
  .group-card-desc { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; }

  .group-card-check {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2.5px solid #d0d5f5;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .group-card.selected .group-card-check {
    background: var(--primary);
    border-color: var(--primary);
  }
  .group-card-check svg { display: none; }
  .group-card.selected .group-card-check svg { display: block; }

  .start-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #5c6ef8 0%, #7c8dff 100%);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'Baloo 2', cursive;
    font-size: 1.3rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(92,110,248,0.35);
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(92,110,248,0.45); }
  .start-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 12px;
  }

  .score-display {
    background: var(--card-bg);
    border-radius: 50px;
    padding: 8px 18px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: var(--shadow);
    font-family: 'Baloo 2', cursive;
    font-size: 1.1rem;
    color: var(--text);
    font-weight: 800;
  }
  .score-star { color: var(--accent2); font-size: 1.2rem; }
  .score-val { color: var(--primary); }

  .progress-wrap {
    flex: 1;
    background: #e2e6ff;
    border-radius: 50px;
    height: 12px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #5c6ef8, #ff6b6b);
    border-radius: 50px;
    transition: width 0.5s cubic-bezier(.4,2,.6,1);
    width: 0%;
  }

  .score-target { font-size: 0.82rem; color: var(--text-muted); font-weight: 700; white-space: nowrap; }

  .play-area {
    background: var(--card-bg);
    border-radius: 28px;
    padding: 40px 28px 32px;
    text-align: center;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
    position: relative;
  }

  .play-prompt {
    font-size: 0.95rem;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 22px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .play-btn {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5c6ef8 0%, #7c8dff 100%);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    box-shadow: 0 8px 32px rgba(92,110,248,0.38), 0 0 0 0 rgba(92,110,248,0.25);
    transition: all 0.18s ease;
    animation: pulse 2.5s ease-in-out infinite;
  }
  .play-btn:hover { transform: scale(1.06); box-shadow: 0 12px 40px rgba(92,110,248,0.48); }
  .play-btn:active { transform: scale(0.97); }
  .play-btn svg { width: 52px; height: 52px; fill: white; margin-left: 8px; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(92,110,248,0.38), 0 0 0 0 rgba(92,110,248,0.25); }
    50% { box-shadow: 0 8px 32px rgba(92,110,248,0.38), 0 0 0 18px rgba(92,110,248,0); }
  }

  .options-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .opt-btn {
    background: var(--card-bg);
    border: 3px solid #e2e6ff;
    border-radius: 18px;
    padding: 18px 8px;
    font-family: 'Baloo 2', cursive;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(92,110,248,0.08);
    transition: all 0.18s ease;
    position: relative;
    overflow: hidden;
  }
  .opt-btn:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 8px 24px rgba(92,110,248,0.22); }
  .opt-btn:active:not(:disabled) { transform: scale(0.97); }

  .opt-btn.correct {
    background: linear-gradient(135deg, #6bcb77, #4db8a5);
    border-color: #6bcb77;
    color: #fff;
    animation: popIn 0.3s ease;
  }
  .opt-btn.wrong {
    background: #f5f5f5;
    border-color: #e0e0e0;
    color: #bbb;
    cursor: not-allowed;
  }
  .opt-btn.selected-multi {
    background: linear-gradient(135deg, #5c6ef8, #7c8dff);
    border-color: var(--primary);
    color: #fff;
  }

  @keyframes popIn {
    0% { transform: scale(0.92); }
    60% { transform: scale(1.07); }
    100% { transform: scale(1); }
  }

  .back-btn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: transparent;
    color: var(--text-muted);
    border: 2px solid #d0d5f5;
    border-radius: var(--radius);
    font-family: 'Baloo 2', cursive;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .back-btn:hover {
    background: #e2e6ff;
    color: var(--primary);
    border-color: var(--primary);
  }

  .star-container {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 999;
  }
  .star-particle {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    animation: starFly 0.9s ease-out forwards;
  }
  @keyframes starFly {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2); }
  }

  .end-card {
    background: var(--card-bg);
    border-radius: 28px;
    padding: 44px 32px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .end-trophy {
    font-size: 5rem;
    margin-bottom: 16px;
    animation: trophySpin 0.6s ease;
  }
  @keyframes trophySpin {
    0%   { transform: scale(0) rotate(-30deg); }
    70%  { transform: scale(1.15) rotate(5deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .end-title {
    font-family: 'Baloo 2', cursive;
    font-size: 2.2rem;
    color: var(--primary);
    margin-bottom: 8px;
  }
  .end-sub {
    color: var(--text-muted);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 32px;
  }
  .end-btn {
    display: inline-block;
    padding: 14px 40px;
    background: linear-gradient(135deg, #5c6ef8, #7c8dff);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-family: 'Baloo 2', cursive;
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(92,110,248,0.35);
    transition: all 0.2s;
    margin: 6px;
  }
  .end-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(92,110,248,0.45); }
  .end-btn.outline {
    background: transparent;
    color: var(--primary);
    border: 2.5px solid var(--primary);
    box-shadow: none;
  }
  .end-btn.outline:hover { background: var(--primary-light); }
</style>
</head>
<body>
<div id="app">

  <!-- SELECT SCREEN -->
  <div id="screen-select" class="screen active">
    <div class="game-title">Phonic Go</div>
    <div class="game-subtitle">Choose groups to practice</div>
    <div class="group-grid" id="group-grid"></div>
    <button class="start-btn" id="start-btn" disabled onclick="startGame()">Start Game</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <div class="score-display">
        <span class="score-star">&#9733;</span>
        <span id="score-val" class="score-val">0</span>
        <span class="score-target">/ 10</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
    <div class="play-area">
      <div class="play-prompt">What sound do you hear?</div>
      <button class="play-btn" id="play-btn" onclick="playCurrentSound()">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    <div class="options-grid" id="options-grid"></div>
    <button class="back-btn" onclick="showScreen('screen-select')">BACK TO MENU</button>
  </div>

  <!-- END SCREEN -->
  <div id="screen-end" class="screen">
    <div class="end-card">
      <div class="end-trophy">&#127942;</div>
      <div class="end-title">You Did It!</div>
      <div class="end-sub" id="end-msg">Amazing job! You reached 10 points!</div>
      <br>
      <button class="end-btn" onclick="startGame()">Play Again</button>
      <button class="end-btn outline" onclick="showScreen('screen-select')">Change Groups</button>
    </div>
  </div>

</div>

<div class="star-container" id="star-container"></div>

<script>
// ===================== DATA =====================
const GROUPS = [
  {
    id: 1,
    name: 'Short Vowels',
    desc: 'a  e  i  o  u',
    iconClass: 'icon-1',
    iconLabel: 'Aa',
    sounds: [
      { label: 'a', file: 'sound_a' },
      { label: 'e', file: 'sound_e' },
      { label: 'i', file: 'sound_i' },
      { label: 'o', file: 'sound_o' },
      { label: 'u', file: 'sound_u' }
    ]
  },
  {
    id: 2,
    name: 'Magic-e (Long Vowels)',
    desc: 'a_e  i_e  o_e  u_e',
    iconClass: 'icon-2',
    iconLabel: 'Ee',
    sounds: [
      { label: 'a_e', file: 'sound_ai' },
      { label: 'i_e', file: 'sound_ie' },
      { label: 'o_e', file: 'sound_oa' },
      { label: 'u_e', file: 'sound_ue' }
    ]
  },
  {
    id: 3,
    name: 'R-Controlled Vowels',
    desc: 'ar  or  er  ir  ur',
    iconClass: 'icon-3',
    iconLabel: 'Rr',
    sounds: [
      { label: 'ar', file: 'sound_ar' },
      { label: 'or', file: 'sound_or' },
      { label: 'er', file: 'sound_er' },
      { label: 'ir', file: 'sound_er' },
      { label: 'ur', file: 'sound_er' }
    ]
  },
  {
    id: 4,
    name: 'Vowel Teams',
    desc: 'ee  ea  ai  ay  oa',
    iconClass: 'icon-4',
    iconLabel: 'Ai',
    sounds: [
      { label: 'ee', file: 'sound_ee' },
      { label: 'ea', file: 'sound_ee' },
      { label: 'ai', file: 'sound_ai' },
      { label: 'ay', file: 'sound_ai' },
      { label: 'oa', file: 'sound_oa' }
    ]
  },
  {
    id: 5,
    name: 'More Vowel Teams',
    desc: 'ou  oo  igh  ie',
    iconClass: 'icon-5',
    iconLabel: 'Ou',
    sounds: [
      { label: 'ou', file: 'sound_ou' },
      { label: 'oo', files: ['sound_ooo', 'sound_oo'] },
      { label: 'igh', file: 'sound_ie' },
      { label: 'ie', file: 'sound_ie' }
    ]
  }
];

const AUDIO_BASE = './individualsound/';

// ===================== STATE =====================
let selectedGroups = [];
let activeSounds = [];
let allSounds = [];
let currentQ = null;
let score = 0;
let audioCtx = null;
let lastAudioFile = null;

// ===================== AUDIO =====================
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

// KEY FIX: always resume() first, then play inside .then()
// This ensures the AudioContext is fully running before any sound node starts,
// which is required on iOS/Android after the first user gesture.
function playCorrectSound() {
  const ctx = getAudioCtx();
  ctx.resume().then(() => {
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.setValueAtTime(1100, t + 0.1);
    gain.gain.setValueAtTime(0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.start(t);
    osc.stop(t + 0.4);
  });
}

function playWrongSound() {
  const ctx = getAudioCtx();
  ctx.resume().then(() => {
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, t);
    osc.frequency.linearRampToValueAtTime(200, t + 0.3);
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    osc.start(t);
    osc.stop(t + 0.3);
  });
}

function playFile(filename) {
  const audio = new Audio(AUDIO_BASE + filename + '.mp3');
  audio.play().catch(e => console.warn('Audio play failed:', e));
}

// ===================== STAR BURST =====================
function burst(x, y) {
  const container = document.getElementById('star-container');
  const colors = ['#ffd93d','#ff6b6b','#5c6ef8','#6bcb77','#ff9ff3','#48dbfb'];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'star-particle';
    const angle = (Math.PI * 2 * i) / 18;
    const dist = 60 + Math.random() * 80;
    el.style.cssText = `
      left:${x}px; top:${y}px;
      background:${colors[i % colors.length]};
      --tx:${Math.cos(angle)*dist}px;
      --ty:${Math.sin(angle)*dist}px;
    `;
    container.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }
}

// ===================== SELECT SCREEN =====================
function buildSelectScreen() {
  const grid = document.getElementById('group-grid');
  grid.innerHTML = '';
  GROUPS.forEach(g => {
    const card = document.createElement('div');
    card.className = 'group-card';
    card.id = 'group-card-' + g.id;
    card.innerHTML = `
      <div class="group-card-icon ${g.iconClass}">${g.iconLabel}</div>
      <div class="group-card-info">
        <div class="group-card-name">${g.name}</div>
        <div class="group-card-desc">${g.desc}</div>
      </div>
      <div class="group-card-check">
        <svg viewBox="0 0 12 10" width="12" height="10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1,5 4,9 11,1"/>
        </svg>
      </div>
    `;
    card.onclick = () => toggleGroup(g.id);
    grid.appendChild(card);
  });
}

function toggleGroup(id) {
  const idx = selectedGroups.indexOf(id);
  if (idx === -1) selectedGroups.push(id);
  else selectedGroups.splice(idx, 1);
  GROUPS.forEach(g => {
    const card = document.getElementById('group-card-' + g.id);
    if (selectedGroups.includes(g.id)) card.classList.add('selected');
    else card.classList.remove('selected');
  });
  document.getElementById('start-btn').disabled = selectedGroups.length === 0;
}

// ===================== HELPERS =====================
function resolveFile(sound) {
  if (sound.files) {
    return sound.files[Math.floor(Math.random() * sound.files.length)];
  }
  return sound.file;
}

function getCorrectLabels(file) {
  return [...new Set(activeSounds.filter(s => {
    if (s.files) return s.files.includes(file);
    return s.file === file;
  }).map(s => s.label))];
}

function getGlobalSoundMatchLabels(file) {
  return [...new Set(allSounds.filter(s => {
    if (s.files) return s.files.includes(file);
    return s.file === file;
  }).map(s => s.label))];
}

// ===================== PICK OPTIONS =====================
function pickOptions(sound, resolvedFile) {
  const correctLabels = getCorrectLabels(resolvedFile);
  const shuffledCorrect = correctLabels.slice().sort(() => Math.random() - 0.5);
  const numCorrect = Math.max(1, Math.floor(Math.random() * shuffledCorrect.length) + 1);
  let chosenCorrect = shuffledCorrect.slice(0, numCorrect);
  if (chosenCorrect.length === 0) chosenCorrect = [correctLabels[0]];

  const chosenCorrectSet = new Set(chosenCorrect);
  const allCorrectSet = new Set(correctLabels);
  const globalSoundMatchSet = new Set(getGlobalSoundMatchLabels(resolvedFile));

  const neededDistractors = 6 - chosenCorrect.length;
  const isValidDistractor = (l) => !allCorrectSet.has(l) && !globalSoundMatchSet.has(l);

  const activeLabels = [...new Set(activeSounds.map(s => s.label))];
  const primaryPool = activeLabels.filter(isValidDistractor);
  const shuffledPrimary = primaryPool.sort(() => Math.random() - 0.5);
  const primaryDistractors = shuffledPrimary.slice(0, neededDistractors);

  let distractors = [...primaryDistractors];
  if (distractors.length < neededDistractors) {
    const usedLabels = new Set([...allCorrectSet, ...distractors]);
    const allLabels = [...new Set(allSounds.map(s => s.label))];
    const fallbackPool = allLabels.filter(l => isValidDistractor(l) && !usedLabels.has(l));
    const shuffledFallback = fallbackPool.sort(() => Math.random() - 0.5);
    const extra = shuffledFallback.slice(0, neededDistractors - distractors.length);
    distractors = [...distractors, ...extra];
  }

  const combined = [...chosenCorrect, ...distractors];
  return { options: combined.sort(() => Math.random() - 0.5), targetAnswers: chosenCorrect };
}

// ===================== GAME LOGIC =====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame() {
  activeSounds = [];
  GROUPS.forEach(g => {
    if (selectedGroups.includes(g.id)) {
      g.sounds.forEach(s => activeSounds.push({ ...s, groupId: g.id }));
    }
  });

  allSounds = [];
  GROUPS.forEach(g => {
    g.sounds.forEach(s => allSounds.push({ ...s, groupId: g.id }));
  });

  score = 0;
  lastAudioFile = null;
  updateScoreUI();
  showScreen('screen-game');
  nextQuestion();
}

function updateScoreUI() {
  document.getElementById('score-val').textContent = score;
  const pct = Math.min((score / 10) * 100, 100);
  document.getElementById('progress-bar').style.width = pct + '%';
}

function nextQuestion() {
  let available = activeSounds.filter(s => {
    if (s.files) return !s.files.includes(lastAudioFile);
    return s.file !== lastAudioFile;
  });
  if (available.length === 0) available = activeSounds;

  const sound = available[Math.floor(Math.random() * available.length)];
  const resolvedFile = resolveFile(sound);
  lastAudioFile = resolvedFile;

  const { options, targetAnswers } = pickOptions(sound, resolvedFile);

  currentQ = {
    sound,
    resolvedFile,
    selectedMulti: [],
    targetAnswers,
    allCorrectLabels: getCorrectLabels(resolvedFile)
  };

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  options.forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = label;
    btn.onclick = () => handleAnswer(btn, label);
    grid.appendChild(btn);
  });

  setTimeout(() => playCurrentSound(), 400);
}

function playCurrentSound() {
  if (currentQ) playFile(currentQ.resolvedFile);
}

function handleAnswer(btn, label) {
  if (btn.disabled) return;

  const { targetAnswers, allCorrectLabels, selectedMulti } = currentQ;
  const isMulti = targetAnswers.length > 1;

  if (isMulti) {
    if (selectedMulti.includes(label)) return;

    if (allCorrectLabels.includes(label)) {
      selectedMulti.push(label);
      btn.classList.add('selected-multi');
      btn.disabled = true;

      const allSelected = targetAnswers.every(m => selectedMulti.includes(m));
      if (allSelected) {
        document.querySelectorAll('.opt-btn.selected-multi').forEach(b => b.classList.add('correct'));
        score += 1;
        updateScoreUI();
        playCorrectSound();
        const rect = btn.getBoundingClientRect();
        burst(rect.left + rect.width / 2, rect.top + rect.height / 2);
        disableAll();
        if (score >= 10) {
          setTimeout(() => showScreen('screen-end'), 1200);
        } else {
          setTimeout(() => nextQuestion(), 1200);
        }
      }
    } else {
      btn.classList.add('wrong');
      btn.disabled = true;
      score = Math.max(0, score - 1);
      updateScoreUI();
      playWrongSound();
      setTimeout(() => playCurrentSound(), 500);
    }
  } else {
    if (allCorrectLabels.includes(label)) {
      btn.classList.add('correct');
      score += 1;
      updateScoreUI();
      playCorrectSound();
      const rect = btn.getBoundingClientRect();
      burst(rect.left + rect.width / 2, rect.top + rect.height / 2);
      disableAll();
      if (score >= 10) {
        setTimeout(() => showScreen('screen-end'), 1200);
      } else {
        setTimeout(() => nextQuestion(), 1200);
      }
    } else {
      btn.classList.add('wrong');
      btn.disabled = true;
      score = Math.max(0, score - 1);
      updateScoreUI();
      playWrongSound();
      setTimeout(() => playCurrentSound(), 500);
    }
  }
}

function disableAll() {
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
}

// ===================== INIT =====================
buildSelectScreen();
</script>
